# DOSBox Staging config for the lab. Replace LAB with the lab folder (e.g. /home/you/lab).
# The game copy must sit at LAB/root/POOLRAD: POOL.CFG expects C:\\POOLRAD\\.
[sdl]
fullscreen = false
output = texture
texture_renderer = software
windowresolution = 640x400
[render]
aspect = off
[dosbox]
machine = svga_s3
[cpu]
core = normal
cpu_cycles = 3000
[mixer]
nosound = true
[capture]
capture_dir = LAB/cap
default_image_capture_formats = raw
[autoexec]
mount c "LAB/root"
c:
cd POOLRAD
START.EXE
